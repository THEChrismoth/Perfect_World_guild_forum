# Общие настройки для контейнеров с Django (web и scheduler)
x-django-env: &django-env
  DEBUG: "False"
  USE_HTTPS: "True"
  ALLOWED_HOSTS: ${DOMAIN:?Укажите DOMAIN в .env}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Укажите DJANGO_SECRET_KEY в .env}
  DATABASE_URL: postgres://${POSTGRES_USER:-forum}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-forum}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forum}
      POSTGRES_USER: ${POSTGRES_USER:-forum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *django-env
    volumes:
      - static:/app/static
      - media:/app/media
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  # Резервные копии по расписанию и по кнопке из админ-панели
  scheduler:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      <<: *django-env
      # Миграции и статику готовит контейнер web
      SKIP_SETUP: "1"
    command: python manage.py run_backup_scheduler
    volumes:
      - media:/app/media
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  static:
  media:
  backups:
  caddy_data:
  caddy_config:
