{% load static %}<!DOCTYPE html>
{# Предпросмотр лота для админ-панели: настоящая карточка сайта с его стилями, тема и цвет — как в админке. #}
<html lang="ru" data-theme="{{ theme }}" data-accent="{{ accent }}">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{% static 'css/accents.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/ui.css' %}">
    <link rel="stylesheet" href="{% static 'auction/css/auction.css' %}">
    <style>
        body { margin: 0; padding: 24px; background: var(--bg); }
        .lot-preview { max-width: 340px; margin: 0 auto; }
        .lot-preview-desc { max-width: 340px; margin: 16px auto 0; color: var(--text); font-size: 14px; line-height: 1.55; }
        .lot-preview-desc span { display: block; margin-bottom: 4px; color: var(--text-muted); font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="lot-preview">{% include 'auction/includes/lot_card.html' with preview=True %}</div>
    {% if lot.description %}
        <div class="lot-preview-desc"><span>Описание на странице лота</span>{{ lot.description|linebreaksbr }}</div>
    {% endif %}
    <script>document.addEventListener('click', function (event) { if (event.target.closest('a')) event.preventDefault(); });</script>
</body>
</html>
