{% if page.has_other_pages %}<nav class="ev-pagination" aria-label="Страницы">{% if page.has_previous %}<a class="ui-btn ui-btn-secondary ui-btn-sm" href="?page={{ page.previous_page_number }}">Назад</a>{% endif %}<span class="ev-muted">{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="ui-btn ui-btn-secondary ui-btn-sm" href="?page={{ page.next_page_number }}">Далее</a>{% endif %}</nav>{% endif %}
