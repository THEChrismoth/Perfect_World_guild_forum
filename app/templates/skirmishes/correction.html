{% extends 'skirmishes/base.html' %}
{% block skirmishes_content %}<section class="ui-card"><h1 class="ui-page-title">Корректировка участия</h1><form method="post" action="{% url 'skirmishes:correct' skirmish.pk %}" class="ui-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="ui-field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}<div class="ui-page-actions"><button class="ui-btn ui-btn-primary">Сохранить</button><a class="ui-btn ui-btn-secondary" href="{{ skirmish.get_absolute_url }}">Вернуться к замесу</a></div></form></section>{% endblock %}
