{# Поле формы заявки. Параметры: field, optional — подписать «необязательно». #}
<div class="ui-field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if optional %} <span class="rc-muted">— необязательно</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<span class="ui-help">{{ field.help_text }}</span>{% endif %}
    {% if field.errors %}<div class="ui-error">{{ field.errors }}</div>{% endif %}
</div>
