version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: forum_db
    environment:
      POSTGRES_DB: forumdb
      POSTGRES_USER: forumuser
      POSTGRES_PASSWORD: forumpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forum_network
    restart: unless-stopped

  app:
    build: ./app
    container_name: forum_app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn forum.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      DATABASE_URL: postgres://forumuser:forumpassword123@db:5432/forumdb
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "False"
    depends_on:
      - db
    networks:
      - forum_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: forum_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - app
    networks:
      - forum_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  forum_network:
    driver: bridge
