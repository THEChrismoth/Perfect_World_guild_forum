{% extends 'forum_app/base.html' %}

{% block title %}Create New Topic - Forum{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="{% url 'forum_detail' forum.id %}" style="color: #35424a; text-decoration: none;">← Back to {{ forum.name }}</a>
</div>

<h2 style="margin-bottom: 20px;">Create New Topic in {{ forum.name }}</h2>

<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Enter topic title..." required>
    </div>
    <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" placeholder="Write your topic content..." required></textarea>
    </div>
    <button type="submit" class="btn">Create Topic</button>
    <a href="{% url 'forum_detail' forum.id %}" style="margin-left: 10px; color: #666; text-decoration: none;">Cancel</a>
</form>
{% endblock %}
