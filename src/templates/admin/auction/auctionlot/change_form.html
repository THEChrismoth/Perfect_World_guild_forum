{% extends "admin/change_form.html" %}

{% block object-tools-items %}
    {{ block.super }}
    {% if original and original.status == 'active' %}
        <li>
            <a href="{% url 'admin:auction_end_auction' original.id %}" class="btn btn-success">🏆 Завершить аукцион</a>
        </li>
        <li>
            <a href="{% url 'admin:auction_cancel_auction' original.id %}" class="btn btn-danger">❌ Отменить аукцион</a>
        </li>
    {% endif %}
{% endblock %}
